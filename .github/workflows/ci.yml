name: CI

on:
    push:
        branches: [main, solidjs-porting]
    pull_request:

jobs:
    lint:
        name: Lint (Prettier and ESLint)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.5'
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Check formatting and lint rules
              run: bun run lint

    typecheck:
        name: Typecheck (TypeScript)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.5'
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Generate translations and typecheck
              run: |
                  # bun run check generates the untracked Paraglide modules itself.
                  ci_suffix="$(openssl rand -hex 16)"
                  export PUBLIC_BETTER_AUTH_URL="https://ci.example.invalid"
                  export RESEND_API_KEY="re_ci_${ci_suffix}"
                  export BUNNY_STORAGE_ACCESS_KEY="ci_${ci_suffix}"
                  bun run check

    build:
        name: Build (vite build)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.5'
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Production build (CI-only dummy credentials)
              run: |
                  # The SSR compiler can import server modules during build. Provide
                  # nonfunctional placeholders only for this step; never use real secrets
                  # or expose these values to a deploy/publish job.
                  ci_suffix="$(openssl rand -hex 16)"
                  export PUBLIC_BETTER_AUTH_URL="https://ci.example.invalid"
                  export BETTER_AUTH_URL="$PUBLIC_BETTER_AUTH_URL"
                  export ORIGIN="$PUBLIC_BETTER_AUTH_URL"
                  export DATABASE_URL="postgresql://ci:ci@db.ci.invalid:5432/ci"
                  export BETTER_AUTH_SECRET="ci_${ci_suffix}${ci_suffix}"
                  export DODO_PAYMENTS_API_KEY="ci_${ci_suffix}"
                  export DODO_PAYMENTS_WEBHOOK_SECRET="ci_${ci_suffix}"
                  export RESEND_API_KEY="re_ci_${ci_suffix}"
                  export BUNNY_URL_TOKEN_AUTH_KEY="ci_${ci_suffix}"
                  export BUNNY_STORAGE_ZONE="ci-placeholder"
                  export BUNNY_CDN_BASE_URL="cdn.example.invalid"
                  export BUNNY_STORAGE_ACCESS_KEY="ci_${ci_suffix}"
                  bun run build

    unit-tests:
        name: Unit tests (server)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.5'
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run unit tests
              run: bun run test:unit -- --run --project=server
            - name: Install Chromium
              run: bunx playwright install --with-deps chromium
            - name: Run Solid browser component tests
              run: bun run test:unit -- --run --project=client

    e2e:
        name: Isolated production-artifact E2E
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.5'
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Install Chromium
              run: bunx playwright install --with-deps chromium
            - name: Install Podman
              run: sudo apt-get update && sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs
            - name: Run E2E with disposable PostgreSQL and mock providers
              run: bun run test:e2e
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: e2e-results
                  path: test-results/
