services:
    db:
        # PostgreSQL 18 is the existing deployment major. Patch updates are
        # reviewed explicitly; never change the major version implicitly.
        image: postgres:18.6-bookworm
        container_name: ace-blocker-db
        restart: unless-stopped
        ports:
            # Keep Postgres on loopback. Docker-published ports bypass normal
            # UFW expectations unless the host IP is explicit.
            - 127.0.0.1:5432:5432
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            # PostgreSQL 18's official image stores its versioned data below
            # /var/lib/postgresql; keep this mount to preserve existing data.
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        stop_grace_period: 30s

volumes:
    pgdata:
